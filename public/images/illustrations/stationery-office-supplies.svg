  <rect y="470" width="800" height="130" fill="#D2E9E7"/>
  <!-- ream of paper -->
  <rect x="90" y="360" width="250" height="120" rx="6" fill="#fff" stroke="#CBD3DB" stroke-width="3"/>
  <rect x="90" y="400" width="250" height="40" fill="#F2A541"/>
  <rect x="120" y="412" width="110" height="9" rx="4" fill="#142D4E"/>
