  <rect x="440" y="250" width="150" height="230" rx="8" fill="#142D4E"/>
  <g fill="#F4F6F8"><circle cx="440" cy="285" r="7"/><circle cx="440" cy="325" r="7"/><circle cx="440" cy="365" r="7"/><circle cx="440" cy="405" r="7"/><circle cx="440" cy="445" r="7"/></g>
  <rect x="468" y="290" width="96" height="70" rx="4" fill="#fff"/>
  <rect x="480" y="304" width="62" height="8" rx="4" fill="#142D4E"/>
