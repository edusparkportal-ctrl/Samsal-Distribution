  <rect x="150" y="300" width="230" height="60" rx="5" fill="#142D4E"/>
  <rect x="150" y="320" width="230" height="8" fill="#fff" opacity=".18"/>
  <rect x="170" y="240" width="210" height="60" rx="5" fill="#0B8F87"/>
  <rect x="170" y="260" width="210" height="8" fill="#fff" opacity=".22"/>
  <rect x="140" y="180" width="220" height="60" rx="5" fill="#F2A541"/>
  <rect x="140" y="200" width="220" height="8" fill="#142D4E" opacity=".25"/>
