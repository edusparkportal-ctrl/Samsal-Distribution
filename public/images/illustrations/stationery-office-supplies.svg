<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Illustration of stationery and office supplies: notebooks, a ream of paper and a pen holder">
  <rect width="800" height="600" fill="#E3F4F3"/>
