  <rect x="640" y="440" width="90" height="10" fill="#fff" opacity=".25"/>
  <g stroke-linecap="round" stroke-width="14"><path d="M655 380L640 250" stroke="#142D4E"/><path d="M685 380L688 235" stroke="#F2A541"/><path d="M715 380L735 260" stroke="#142D4E" /></g>
